<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2ea" />
    <title>PCL-X 论坛</title>
    <link rel="icon" href="https://i.ibb.co/3Y123m9P/icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="forum.css" />
  </head>
  <body class="forum-body">
    <div class="grain" aria-hidden="true"></div>
    <header class="nav forum-nav">
      <a class="brand" href="index.html">
        <img src="https://i.ibb.co/3Y123m9P/icon.png" data-fallback-url="https://bohemiao-pclx.github.io/pclx-site/assets/icon.png" alt="" width="34" height="34" />
        <span>PCL-X</span><em>论坛</em>
      </a>
      <div class="forum-nav-actions">
        <a class="nav-github" href="index.html">返回官网</a>
        <span class="forum-auth-name" id="authName"></span>
        <button class="mini-button" id="categoryAdminButton" type="button" hidden>板块</button>
        <button class="mini-button" id="socialButton" type="button" hidden>好友与私聊</button>
        <button class="mini-button" id="officialButton" type="button" hidden>官方消息</button>
        <button class="mini-button" id="profileButton" type="button" hidden>我的</button>
        <button class="mini-button" id="authButton" type="button">登录 / 注册</button>
        <button class="mini-button dark" id="newPostButton" type="button">发帖</button>
      </div>
    </header>

    <main class="forum-main">
      <section class="forum-hero">
        <p class="eyebrow"><span class="dot"></span> PCL-X COMMUNITY</p>
        <div class="forum-hero-row">
          <h1>在启动器之外，<br /><span class="serif">也聊一聊。</span></h1>
          <p>和 PCL-X 用户交流、求助、分享。论坛与启动器内社区使用同一个账户和同一套数据。</p>
        </div>
      </section>

      <nav class="forum-web-tabs" id="tabs">
        <button type="button" class="active" data-tab="all">全部</button>
        <button type="button" data-tab="featured">精华</button>
        <button type="button" data-tab="announcements">官方通告</button>
        <button type="button" data-tab="following">关注</button>
        <button type="button" data-tab="favorites">收藏</button>
      </nav>

      <div class="forum-web-toolbar">
        <div class="forum-web-cats" id="categories">
          <button type="button" class="active" data-cat="all">全部</button>
          <button type="button" data-cat="general">综合</button>
          <button type="button" data-cat="help">求助</button>
          <button type="button" data-cat="showcase">展示</button>
          <button type="button" data-cat="chat">闲聊</button>
        </div>
        <div class="forum-web-search">
          <span>⌕</span>
          <input id="searchInput" placeholder="搜索帖子…" />
          <button type="button" id="searchButton">搜索</button>
        </div>
      </div>

      <div class="forum-web-status" id="status">正在读取帖子…</div>
      <div class="forum-web-list" id="postList"></div>
    </main>

    <footer class="forum-footer">
      <span>PCL-X Community</span>
      <span><a href="index.html">官网</a> · <a href="https://github.com/bohemiao-pclx/pclx-updates" target="_blank" rel="noreferrer">GitHub</a></span>
    </footer>

    <div class="modal-backdrop" id="socialModal" hidden>
      <div class="web-modal social-modal">
        <button class="modal-x" data-close="socialModal">×</button>
        <h2>好友与私聊</h2>
        <div class="social-layout">
          <aside class="social-side">
            <form id="addFriendForm" class="social-add">
              <input id="addFriendName" placeholder="用户名" maxlength="20" required />
              <button type="submit">加好友</button>
            </form>
            <div class="social-section-title">好友请求</div>
            <div id="friendRequests" class="social-list"></div>
            <div class="social-section-title">好友</div>
            <div id="friendsList" class="social-list"></div>
            <div class="social-section-title">最近聊天</div>
            <div id="conversationList" class="social-list"></div>
          </aside>
          <section class="social-chat">
            <div id="chatHead" class="social-chat-head">选择好友开始聊天</div>
            <div id="chatMessages" class="social-messages"></div>
            <form id="chatForm" class="social-chat-form" hidden>
              <input id="chatInput" placeholder="输入消息…" maxlength="5000" autocomplete="off" />
              <button type="submit">发送</button>
            </form>
          </section>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="authModal" hidden>
      <div class="web-modal">
        <button class="modal-x" data-close="authModal">×</button>
        <h2 id="authTitle">登录论坛</h2>
        <p class="web-modal-sub">论坛账户与 Minecraft 账户独立。</p>
        <form id="authForm">
          <label>用户名<input id="authUser" autocomplete="username" required maxlength="20" /></label>
          <label>密码<input id="authPass" type="password" autocomplete="current-password" required maxlength="72" /></label>
          <div class="web-form-actions">
            <button type="button" class="text-button" id="switchAuth">没有账户？注册</button>
            <button class="solid-button" type="submit" id="authSubmit">登录</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-backdrop" id="postModal" hidden>
      <div class="web-modal wide">
        <button class="modal-x" data-close="postModal">×</button>
        <div id="postDetail"></div>
      </div>
    </div>

    <div class="modal-backdrop" id="newModal" hidden>
      <div class="web-modal wide">
        <button class="modal-x" data-close="newModal">×</button>
        <h2>发布帖子</h2>
        <form id="newForm">
          <label>标题<input id="newTitle" required maxlength="100" /></label>
          <label>分类
            <select id="newCategory">
              <option value="general">综合</option><option value="help">求助</option>
              <option value="showcase">展示</option><option value="chat">闲聊</option>
            </select>
          </label>
          <label>投票选项（可选，每行一个）<textarea id="newPoll" rows="2" maxlength="500" placeholder="2–6 个选项，每行一个"></textarea></label>
          <label>帖子高亮<select id="newHighlight"><option value="">无</option><option value="blue">蓝色</option><option value="green">绿色</option><option value="amber">琥珀</option><option value="purple">紫色</option></select></label>
          <label>正文<textarea id="newContent" rows="7" required maxlength="20000" placeholder="写点什么…支持 Markdown：**加粗**、*斜体*、- 列表、`代码`、[链接](https://…)"></textarea></label>
          <div class="file-upload-field">
            <span>附件（可选）</span>
            <label class="file-drop" id="fileDrop">
              <input id="newFile" type="file" accept="image/*,video/*,.zip,.rar,.7z,.txt,.pdf,.jar,.json,.log" />
              <b>选择要上传的文件</b>
              <small>图片 / 视频 / 文件 · 自动上传到免费托管 · 最大 100 MB</small>
            </label>
            <div class="file-status" id="fileStatus" hidden></div>
            <input id="newAttachment" placeholder="也可以直接粘贴附件 URL（可选）" />
          </div>
          <div class="web-form-actions"><span></span><button class="solid-button" type="submit" id="publishButton">发布</button></div>
        </form>
      </div>
    </div>

    <div class="modal-backdrop" id="editModal" hidden>
      <div class="web-modal wide">
        <button class="modal-x" data-close="editModal">×</button>
        <h2>编辑帖子</h2>
        <form id="editForm">
          <label>标题<input id="editTitle" required maxlength="100" /></label>
          <label>分类<select id="editCategory"></select></label>
          <label>正文<textarea id="editContent" rows="8" required maxlength="20000"></textarea></label>
          <div class="web-form-actions"><span class="web-modal-sub">编辑后保留发布时间</span><button class="solid-button" type="submit">保存</button></div>
        </form>
      </div>
    </div>

    <div class="modal-backdrop" id="officialModal" hidden>
      <div class="web-modal wide">
        <button class="modal-x" data-close="officialModal">×</button>
        <h2>官方消息</h2>
        <div id="officialList" class="official-list"></div>
      </div>
    </div>

    <div class="modal-backdrop" id="profileEditModal" hidden>
      <div class="web-modal">
        <button class="modal-x" data-close="profileEditModal">×</button>
        <h2>编辑个人资料</h2>
        <form id="profileEditForm">
          <label>昵称<input id="profileName" required maxlength="20" /></label>
          <label>简介<textarea id="profileBio" rows="3" maxlength="200"></textarea></label>
          <div class="web-profile-form-row">
            <label>性别<select id="profileGender"><option value="secret">保密</option><option value="male">男</option><option value="female">女</option></select></label>
            <label>年龄<input id="profileAge" type="number" min="0" max="120" /></label>
          </div>
          <label>头衔<select id="profileTitle"></select></label>
          <label>IP 属地<input id="profileIp" maxlength="60" placeholder="例如：中国 / 广东" /></label>
          <div class="web-form-actions"><span></span><button class="solid-button" type="submit">保存</button></div>
        </form>
      </div>
    </div>

    <div class="modal-backdrop" id="categoryModal" hidden>
      <div class="web-modal">
        <button class="modal-x" data-close="categoryModal">×</button>
        <h2>新建板块</h2>
        <p class="web-modal-sub">创建后网页论坛和启动器内论坛都会出现。</p>
        <form id="categoryForm">
          <label>板块名称<input id="categoryLabel" placeholder="例如：红石" maxlength="20" required /></label>
          <label>英文标识<input id="categoryKey" placeholder="例如：redstone" maxlength="20" required /></label>
          <div class="web-form-actions"><span></span><button class="solid-button" type="submit">创建</button></div>
        </form>
      </div>
    </div>

    <div class="modal-backdrop" id="profileModal" hidden>
      <div class="web-modal wide">
        <button class="modal-x" data-close="profileModal">×</button>
        <div id="profileContent"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="markdown.js"></script>
    <script src="forum.js"></script>
  </body>
</html>
