<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCL-X 活动</title>
    <link rel="icon" href="https://i.ibb.co/3Y123m9P/icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .activity-wrap { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 110px 0 70px; }
      .activity-tabs { display: flex; gap: 7px; flex-wrap: wrap; margin: 18px 0; }
      .activity-tab { padding: 8px 13px; border: 1px solid var(--line, #ddd); border-radius: 999px; background: #fff; color: #555; font: inherit; font-size: 11px; cursor: pointer; }
      .activity-tab.active { border-color: #4169ff; color: #4169ff; background: rgba(65,105,255,.06); }
      .activity-frame { width: 100%; height: min(74vh, 780px); border: 1px solid var(--line, #ddd); border-radius: 16px; background: #fff; }
      .activity-empty { padding: 40px; border: 1px dashed #ddd; border-radius: 14px; color: #777; text-align: center; }
    </style>
  </head>
  <body>
    <header class="nav" style="position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20">
      <a class="brand" href="index.html"><img src="https://i.ibb.co/3Y123m9P/icon.png" alt="" width="34" height="34" /><span>PCL-X</span><em>活动</em></a>
      <nav class="nav-links"><a href="index.html">官网</a><a href="forum.html">论坛</a><a href="activity.html">活动</a></nav>
    </header>
    <main class="activity-wrap">
      <p class="eyebrow"><span class="dot"></span> PCL-X EVENTS</p>
      <h1 class="page-title" style="font-size:clamp(38px,6vw,68px);margin:10px 0 4px">官方活动<span class="serif">，一起玩。</span></h1>
      <div id="activityTabs" class="activity-tabs"></div>
      <div id="activityBody" class="activity-empty">正在读取活动…</div>
    </main>
    <script>
      (async function () {
        const tabs = document.getElementById('activityTabs')
        const body = document.getElementById('activityBody')
        let activities = []
        let active = null
        async function loadHtml(slug) {
          try {
            const response = await fetch('https://pclx-forum.pages.dev/api/activities/' + encodeURIComponent(slug), { cache: 'no-store' })
            const data = await response.json()
            body.className = ''
            body.innerHTML = ''
            const frame = document.createElement('iframe')
            frame.className = 'activity-frame'
            frame.setAttribute('sandbox', 'allow-scripts')
            frame.srcdoc = data.activity?.html || '<p>活动内容为空。</p>'
            body.appendChild(frame)
          } catch {
            body.className = 'activity-empty'
            body.textContent = '读取活动内容失败。'
          }
        }
        function renderTabs() {
          tabs.innerHTML = activities.map((item) => `<button class="activity-tab ${active === item.slug ? 'active' : ''}" data-slug="${item.slug}">${item.title.replace(/[<>&]/g, '')}</button>`).join('')
          tabs.querySelectorAll('button').forEach((button) => button.addEventListener('click', () => {
            active = button.dataset.slug
            renderTabs()
            loadHtml(active)
          }))
        }
        try {
          const response = await fetch('https://pclx-forum.pages.dev/api/activities', { cache: 'no-store' })
          const data = await response.json()
          activities = data.activities || []
          if (!activities.length) { body.textContent = '暂时没有活动。'; return }
          active = activities[0].slug
          renderTabs()
          await loadHtml(active)
        } catch { body.textContent = '读取活动列表失败。' }
      })()
    </script>
  </body>
</html>
